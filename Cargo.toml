[workspace]
members = [
    # ArchEngine — geometry kernel + viewer
    "archengine/geometry",
    "archengine/viewer",
    "archengine/solver",
    
    # Regime Engine — constraints + rules
    "regime/obc",
    "regime/zoning",
    "regime/params",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Jer <jer@legible.studio>"]

[workspace.dependencies]
# Geometry — to be decided (parry3d, truck, or OCCT bindings)
# nalgebra = "0.33"
# parry3d = "0.17"

# Graphics — Vulkan via ash (decision: questions.md A4, Jer 2026-09-08)
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"
winit = "0.30"
shaderc = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "hdr"] }

# Solver — to be decided (good_lp + CBC, or custom)
# good_lp = "1"

# Common
glam = { version = "0.29", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
