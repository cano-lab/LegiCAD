[workspace]
members = [
    # ArchEngine — geometry kernel + viewer
    "archengine/geometry",
    "archengine/viewer",
    "archengine/solver",
    
    # Regime Engine — constraints + rules
    "regime/obc",
    "regime/zoning",
    "regime/params",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Jer <jer@legible.studio>"]

[workspace.dependencies]
# Geometry — to be decided (parry3d, truck, or OCCT bindings)
# nalgebra = "0.33"
# parry3d = "0.17"

# Graphics — to be decided (wgpu vs raw Vulkan)
# wgpu = "23"

# Solver — to be decided (good_lp + CBC, or custom)
# good_lp = "1"

# Common
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
