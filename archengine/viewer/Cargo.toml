[package]
name = "archengine-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ArchEngine viewer — Vulkan renderer + compute path tracer (Rust port of legacy/ArchEngine_kernel, see questions.md A4)"
build = "build.rs"

[[bin]]
name = "archrender"
path = "src/bin/archrender.rs"

[[bin]]
name = "archview"
path = "src/bin/archview.rs"
required-features = ["windowed"]

[[bin]]
name = "archview-massing"
path = "src/bin/archview_massing.rs"
required-features = ["windowed"]

[features]
default = ["windowed"]
# Windowed mode: winit window + swapchain presentation.
# Headless (compute-only, e.g. batch path-traced renders) builds without winit:
#   cargo check -p archengine-viewer --no-default-features
windowed = ["dep:winit", "ash-window", "raw-window-handle", "ui"]
# egui overlay (pure Rust, replaces the legacy Dear ImGui layer — C++ was
# imgui_layer.cpp; decision: imgui-rs is Rust API over a C++ core, egui is
# 100% Rust). Only meaningful with a window + swapchain.
ui = ["dep:egui", "dep:egui-winit", "dep:egui-ash-renderer"]
# Intel Open Image Denoise for the path tracer's HDR output (M1 target:
# `brew install open-image-denoise`, discovered via pkg-config). Without
# this feature the verbatim 3×3 CPU filter is used instead.
denoise-oidn = ["dep:oidn"]

[dependencies]
archengine-geometry = { path = "../geometry" }
regime-params = { path = "../../regime/params" }
regime-zoning = { path = "../../regime/zoning" }
ash.workspace = true
ash-window = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
glam.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
oidn = { version = "2", optional = true }
egui = { version = "0.36", optional = true }
egui-winit = { version = "0.36", optional = true }
egui-ash-renderer = { version = "0.13", optional = true }

[build-dependencies]
shaderc.workspace = true
anyhow.workspace = true
